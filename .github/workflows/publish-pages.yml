name: publish-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'erp-architecture/**'
      - 'md-follow-up/source-health.json'
      - 'md-follow-up/index.html'
      - 'md-follow-up/app.js'
      - 'md-follow-up/drilldown.js'
      - 'md-follow-up/styles.css'
      - 'md-follow-up/pivot.css'
      - 'md-follow-up/pivot.js'
      - 'md-follow-up/pivot.html'
      - 'md-follow-up/qp40.html'
      - 'md-follow-up/line-audit.html'
      - 'md-follow-up/mm.html'
      - 'md-follow-up/navigation.css'
      - 'md-follow-up/navigation.js'
      - 'md-follow-up/workspace.css'
      - 'md-follow-up/workspace.js'
      - 'md-follow-up/morning-status.css'
      - 'md-follow-up/morning-status.js'
      - 'md-follow-up/morning-refresh-status.json'
      - 'md-follow-up/sharepoint-morning-status.json'
      - 'md-follow-up/architecture.html'
      - 'index.html'
      - '.github/workflows/publish-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
          retention-days: 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
