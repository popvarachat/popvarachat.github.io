name: publish-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'car-complaint-2026/index.html'
      - 'car-complaint-2026/auditor-trace-v1.js'
      - 'car-complaint-2026/auditor-trace-data-v1.js'
      - 'car-complaint-2026/attachments/**'
      - 'erp-architecture/**'
      - 'md-follow-up/source-health.json'
      - 'md-follow-up/index.html'
      - 'md-follow-up/app.js'
      - 'md-follow-up/drilldown.js'
      - 'md-follow-up/styles.css'
      - 'md-follow-up/pivot.css'
      - 'md-follow-up/pivot.js'
      - 'md-follow-up/pivot.html'
      - 'md-follow-up/qp40.html'
      - 'md-follow-up/line-audit.html'
      - 'md-follow-up/mm.html'
      - 'md-follow-up/navigation.css'
      - 'md-follow-up/navigation.js'
      - 'md-follow-up/workspace.css'
      - 'md-follow-up/workspace.js'
      - 'md-follow-up/morning-status.css'
      - 'md-follow-up/morning-status.js'
      - 'md-follow-up/morning-refresh-status.json'
      - 'md-follow-up/sharepoint-morning-status.json'
      - 'md-follow-up/architecture.html'
      - 'index.html'
      - '.github/workflows/publish-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Check Customer Complaint web syntax and data reconciliation
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const h=fs.readFileSync('car-complaint-2026/index.html','utf8');
          const get=id=>{const x=h.match(new RegExp('<script type="application/json" id="'+id+'">([\\s\\S]*?)<\\/script>'));assert(x,id+' JSON missing');return JSON.parse(x[1]);};
          const d=get('data'),p=get('pmo-data'),l=get('lineage');
          assert.strictEqual(d.cases.length,15);assert.strictEqual(l.records.length,15);
          assert.deepStrictEqual(d.cases.filter(x=>x.level==='HOLD').map(x=>x.n),[2,3,14,15]);
          assert.strictEqual(p.actual_cases_total,15);assert.strictEqual(p.summary26_rollup_count,15);
          assert.strictEqual(p.october_pending_rollup_count,0);assert.strictEqual(p.actual_case_counts[9],1);
          assert.strictEqual(p.department_allocation.find(x=>x.name==='Sale').monthly[9],1);
          assert(Math.abs(p.allocation_equivalent_total-14.98)<0.001);
          const tags=[...h.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)];
          let compiled=0;for(const t of tags){if(/application\/json/.test(t[1]))continue;if(t[2].trim()){new vm.Script(t[2]);compiled++;}}
          assert(compiled>0,'JavaScript script missing');
          const au=fs.readFileSync('car-complaint-2026/auditor-trace-v1.js','utf8');
          const aud=fs.readFileSync('car-complaint-2026/auditor-trace-data-v1.js','utf8');
          new vm.Script(au);new vm.Script(aud);
          const runtime={window:{}};vm.runInNewContext(aud,runtime);
          const matrix=runtime.window.PTK_AUDITOR_DATA;
          assert.strictEqual(matrix.cases.length,15);
          assert.strictEqual(matrix.totals.summary26,p.summary26_rollup_count);
          assert.strictEqual(matrix.cases.find(x=>x.n===14).register_car,'CXD-144');
          assert.strictEqual(matrix.cases.find(x=>x.n===14).month_detail_car,'CXD-089');
          assert.strictEqual(matrix.cases.find(x=>x.n===9).month_detail_car,'CXD-097');
          assert.strictEqual(matrix.cases.find(x=>x.n===15).register_car,'CXD-149');
          assert.strictEqual(matrix.totals.effectiveness_verified,0);
          const attScript=fs.readFileSync('car-complaint-2026/attachments/attachment-twin-data-v1.js','utf8');
          const attApp=fs.readFileSync('car-complaint-2026/attachments/app.js','utf8');
          new vm.Script(attScript);new vm.Script(attApp);
          const ta={window:{}};vm.runInNewContext(attScript,ta);
          const twin=ta.window.PTK_ATTACHMENT_TWIN;
          assert.strictEqual(twin.nodes.length,67);
          assert.strictEqual(twin.root_nodes.length,21);
          assert.strictEqual(twin.scope.distinct_sha256,37);
          assert.strictEqual(twin.shared_groups.length,3);
          assert(!attScript.includes('"sha256"') && !attScript.includes('source_rel') && !attScript.includes('attachment_name'));
          assert(h.includes('id="attachmentTwinBtn"'));
          assert(!h.includes('"14":{"code":"CXD-144"}'),'conflicting CAR link still enabled');
          console.log('QMR HTML and Auditor scripts compiled; 17 Nov consolidated register 15/15 verified against sanitized matrix');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
          retention-days: 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
