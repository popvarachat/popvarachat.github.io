<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practika Network Digital Twin | Mind Map</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1424;color:#e6f2ff;font:15px system-ui,'Segoe UI',sans-serif}header{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #34465a}h1{margin:0;font-size:23px}a{color:#8bd0ff}.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:calc(100vh - 78px)}.canvas{position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#1b2d47,#0b1424)}svg{width:100%;height:100%;touch-action:none;cursor:grab}svg:active{cursor:grabbing}aside{padding:26px;background:#142136;border-left:1px solid #324861;overflow:auto}aside h2{font-size:24px}aside p{line-height:1.8;color:#bdcede}.buttons{position:absolute;top:12px;left:12px;z-index:1;display:flex;gap:6px;flex-wrap:wrap}button{background:#233c59;border:1px solid #4a7191;color:white;border-radius:9px;padding:9px 12px;cursor:pointer}.node{cursor:pointer;transition:opacity .2s}.node rect{stroke:#84a4c5;stroke-width:1.5}.node text{fill:white;pointer-events:none}.node.active rect{stroke:#ffe088;stroke-width:3}.node.dim{opacity:.2}.edge{fill:none;stroke:#83abc8;stroke-width:2;opacity:.5}.edge.dim{opacity:.06}.sub{font-size:10px;fill:#c2d8e8!important}.muted{color:#a7c1d4;font-size:12px}.children{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.app{display:block;height:auto}.canvas{height:63vh;min-height:430px}aside{min-height:250px}}</style></head><body>
<header><h1>Practika Network Digital Twin — Interactive Mind Map</h1><nav><a href="./index.html">← กลับหน้าหลัก (Main Dashboard)</a> · <a href="../">Project Portal</a></nav></header>
<div class="app"><div class="canvas"><div class="buttons"><button id="reset">ภาพรวม</button><button id="expand">ขยายทั้งหมด</button><button id="fold">ยุบกิ่ง</button><button id="zin">＋</button><button id="zout">－</button></div><svg id="svg"><g id="world"><g id="lines"></g><g id="items"></g></g></svg></div><aside><span class="muted">คลิกหัวข้อเพื่อดูคำอธิบาย · ดับเบิลคลิกเพื่อยุบ/ขยาย</span><h2 id="heading"></h2><b id="subtitle"></b><p id="detail"></p><div id="children" class="children"></div><hr><p class="muted">ข้อมูลอ้างอิง: Snapshot 8 ต.ค. 2569 (ไม่ใช่ Real-time) • Public-safe ไม่เปิดเผย IP / Hostname / Credential / รายละเอียดช่องโหว่</p></aside></div>
<script>
const data=[
['root','Network Digital Twin','Executive overview','Digital Twin เปลี่ยนข้อมูลการค้นพบเครือข่าย ให้เป็นหลักฐานเพื่อบริหารความเสี่ยง ประสิทธิภาพ และการตัดสินใจ',null],
['scan','สำรวจเครือข่าย','Discovery 100%','สำรวจ 4,957,500 checks เสร็จครบ พบ 477 live nodes, 209 deep nodes และ 20 core full-port nodes','root'],
['assets','Asset Inventory','477 nodes','รวบรวมสินทรัพย์และจัดกลุ่มอุปกรณ์ รวมถึงระดับความเชื่อมั่นของข้อมูล','scan'],
['proof','Scan Evidence','Read-only','จัดเก็บหลักฐานจากการตรวจวัด และแยกข้อมูลที่ยืนยันแล้วออกจากข้อสันนิษฐาน','scan'],
['operate','การให้บริการ','Operate','บริหารการทำงานของเครือข่าย บริการ และการเฝ้าระวังเพื่อป้องกันผลกระทบ','root'],
['health','Critical-path','18/18 zero loss','เป้าหมายสำคัญ 18 จุดไม่พบ Packet Loss ในรอบการวัดล่าสุด ไม่ใช่การรับรองทั้งระบบ','operate'],
['monitor','Monitoring','Telemetry gap','ต้องบูรณาการ CPU, RAM, Storage, Traffic, Error และแนวโน้มจากระบบ Monitoring','operate'],
['protect','ความปลอดภัย','Protect','จัดลำดับความเสี่ยงและแก้ไขด้วยหลักฐาน โดยมีเจ้าของงานและแผน Rollback','root'],
['legacy','Legacy Systems','Lifecycle','ทบทวนอายุระบบและช่องทางบริหารจัดการที่ไม่ปลอดภัย โดยไม่เปลี่ยนค่าอุปกรณ์จนกว่าจะประเมินผลกระทบ','protect'],
['recovery','Service Continuity','Backups & HA','ตรวจสอบ Backup, Restore, Dependency และจุดล้มเหลวจุดเดียว (SPOF)','protect'],
['optimize','ประสิทธิภาพ','Optimize','จัดการความจุ การใช้ทรัพยากร การเติบโตของข้อมูล และคุณภาพ Wi-Fi','root'],
['capacity','Capacity Planning','Storage','กำหนด Threshold และ Forecast พร้อมแผน Archive และ Cold-data review','optimize'],
['wifi','Wi-Fi Experience','One-client snapshot','ข้อมูล Wi-Fi จาก Notebook หนึ่งเครื่อง ไม่เท่ากับคุณภาพสัญญาณทั้งองค์กร','optimize'],
['physical','Physical Twin','0/5 confirmed','Logical Topology พร้อมใช้วิเคราะห์ แต่ต้องมี Management Plane read-only เพื่อยืนยันสายและพอร์ตจริง','root'],
['fdb','Switch Port ↔ MAC','Partial','ตรวจ MAC/FDB table และ Port Association จาก Managed Switch','physical'],
['uplink','LLDP / CDP','Pending Auth','ตรวจ Neighbor/Uplink ระหว่าง Switch, Core และ Access Layer','physical'],
['ap','AP Association','Partial','ตรวจ AP Inventory และการเชื่อมต่อ Client จริง','physical'],
['vlan','VLAN Membership','Partial','พิสูจน์ VLAN ID, PVID, Tagged และ Untagged โดยไม่เดาจาก Subnet','physical'],
['firewall','Firewall Metadata','Partial','ตรวจ Interface, Zone, Route, NAT และ Policy แบบ Read-only','physical'],
['govern','ธรรมาภิบาล','Govern','เชื่อมโยง Owner, Evidence, License, Renewal และการติดตามความคืบหน้า','root'],
['license','License Calendar','Expiry gap','กำหนดวันหมดอายุ สัญญา ต้นทุน และการแจ้งเตือนล่วงหน้า','govern'],
['gate','Human Gate','Authorized access','การเปิดเผย Credential ต้องทำเฉพาะบนเครื่องที่ได้รับอนุญาต ไม่ผ่านเว็บสาธารณะ','govern']
].map(([id,title,sub,detail,parent])=>({id,title,sub,detail,parent}));const by=Object.fromEntries(data.map(n=>[n.id,n]));const kids=id=>data.filter(n=>n.parent===id),anc=id=>{let out=[];while(by[id]?.parent){id=by[id].parent;out.push(id)}return out};let selected='root',folded=new Set(),scale=1,dx=0,dy=0;const svg=document.getElementById('svg'),world=document.getElementById('world'),lines=document.getElementById('lines'),items=document.getElementById('items');
function make(tag,props,p){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(props).forEach(([k,v])=>e.setAttribute(k,v));p.append(e);return e}
function scene(){world.setAttribute('transform',`translate(${svg.clientWidth/2+dx},${svg.clientHeight/2+dy}) scale(${scale})`)}
function view(){const arr=data.filter(n=>!anc(n.id).some(a=>folded.has(a))),pos={root:[0,0]};let top=kids('root'),colors=['#376b96','#3e7f8b','#915d4b','#527849','#7561a3','#977b40'];top.forEach((n,i)=>{let angle=-Math.PI/2+i*2*Math.PI/top.length;pos[n.id]=[Math.cos(angle)*320,Math.sin(angle)*255];kids(n.id).filter(k=>arr.includes(k)).forEach((k,j,ks)=>{let a=angle+(j-(ks.length-1)/2)*.27;pos[k.id]=[pos[n.id][0]+Math.cos(a)*230,pos[n.id][1]+Math.sin(a)*230]})});lines.replaceChildren();items.replaceChildren();arr.forEach(n=>{if(!n.parent)return;let a=pos[n.parent],b=pos[n.id];if(a&&b){let p=make('path',{d:`M${a[0]},${a[1]} C${a[0]+(b[0]-a[0])*.5},${a[1]} ${b[0]-(b[0]-a[0])*.5},${b[1]} ${b[0]},${b[1]}`,class:'edge'+(selected!=='root'&&n.id!==selected&&!anc(selected).includes(n.id)&&n.parent!==selected?' dim':'')},lines)}});arr.forEach(n=>{const [x,y]=pos[n.id]||[0,0],branch=anc(n.id).at(-1)||n.id,i=top.findIndex(t=>t.id===branch);let g=make('g',{transform:`translate(${x},${y})`,class:'node'+(selected===n.id?' active':'')+(selected!=='root'&&n.id!==selected&&!anc(selected).includes(n.id)&&!anc(n.id).includes(selected)?' dim':'')},items);make('rect',{x:-102,y:-30,width:204,height:60,rx:14,fill:n.id==='root'?'#25577c':colors[Math.max(0,i)%colors.length]},g);make('text',{'text-anchor':'middle',y:-6,'font-size':'12','font-weight':'700'},g).textContent=n.title;make('text',{'text-anchor':'middle',y:15,class:'sub'},g).textContent=n.sub;g.onclick=()=>select(n.id);g.ondblclick=e=>{e.stopPropagation();folded.has(n.id)?folded.delete(n.id):folded.add(n.id);view()}});scene()}
function select(id){selected=id;document.getElementById('heading').textContent=by[id].title;document.getElementById('subtitle').textContent=by[id].sub;document.getElementById('detail').textContent=by[id].detail;let box=document.getElementById('children');box.replaceChildren();kids(id).forEach(n=>{let b=document.createElement('button');b.textContent=n.title;b.onclick=()=>{anc(n.id).forEach(a=>folded.delete(a));select(n.id)};box.append(b)});view()}
function fit(){dx=0;dy=0;scale=Math.min(svg.clientWidth/1200,svg.clientHeight/950,1);scene()}document.getElementById('reset').onclick=()=>{folded.clear();select('root');fit()};document.getElementById('expand').onclick=()=>{folded.clear();view()};document.getElementById('fold').onclick=()=>{folded=new Set(kids('root').map(n=>n.id));select('root')};document.getElementById('zin').onclick=()=>{scale=Math.min(2.5,scale*1.2);scene()};document.getElementById('zout').onclick=()=>{scale=Math.max(.2,scale/1.2);scene()};svg.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.2,Math.min(2.5,scale*(e.deltaY>0?.9:1.1)));scene()},{passive:false});let drag=null;svg.onpointerdown=e=>{if(e.target.closest('.node'))return;drag=[e.clientX,e.clientY];svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(!drag)return;dx+=e.clientX-drag[0];dy+=e.clientY-drag[1];drag=[e.clientX,e.clientY];scene()};svg.onpointerup=()=>drag=null;window.onresize=scene;select('root');fit();
</script></body></html>
